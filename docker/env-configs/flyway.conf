# connection (url/user/password) comes from FLYWAY_* env vars - see docker-compose.yml
flyway.locations = filesystem:/flyway/sql
flyway.schemas = acuity,acuity_utils,maintenance_tasks
flyway.createSchemas = true
flyway.validateOnMigrate = false

# acuity app-role password migrations create it with - must match POSTGRES_PASSWORD in the app env files
flyway.placeholders.user.acuity.password = test
