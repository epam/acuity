# connection (url/user/password) and the acuity-role placeholder password come from
# env vars instead (see docker-compose.yml + flyway.Dockerfile) - nothing load-bearing
# is baked in here, only structural settings tied to the migration bundle itself.
flyway.locations = filesystem:/flyway/sql
flyway.schemas = acuity,acuity_utils,maintenance_tasks
flyway.createSchemas = true
flyway.validateOnMigrate = false
