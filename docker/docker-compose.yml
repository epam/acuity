name: acuity
services:
  acuity-postgres:
    image: acuity-postgres
    restart: always
    ports:
      - "5432:5432"
    env_file: env-configs/postgres.env
    volumes:
      - type: volume
        source: pgdata
        target: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  acuity-flyway-migrate:
    image: acuity-flyway
    environment:
      FLYWAY_URL: jdbc:postgresql://acuity-postgres:5432/acuity_db
      FLYWAY_USER: test
      FLYWAY_PASSWORD: test
    depends_on:
      acuity-postgres:
        condition: service_healthy

  acuity-admin:
    image: acuity-admin
    ports:
      - "9090:8000"
    env_file: env-configs/acuity-admin.env
    depends_on:
      acuity-flyway-migrate:
        condition: service_completed_successfully

  acuity-va-security:
    image: acuity-va-security
    ports:
      - "8000:8000"
    env_file: env-configs/va-security.env
    depends_on:
      acuity-flyway-migrate:
        condition: service_completed_successfully

  acuity-va-hub:
    image: acuity-va-hub
    ports:
      - "8080:8000"
    env_file: env-configs/va-hub.env
    depends_on:
      acuity-flyway-migrate:
        condition: service_completed_successfully

  acuity-va-hub-ui:
    image: acuity-va-hub-ui
    ports:
      - "3000:8000"
    env_file: env-configs/vahub-ui.env
    depends_on:
      - acuity-va-hub
volumes:
  pgdata:
