name: acuity
services:
  acuity-postgres:
    image: 897021975362.dkr.ecr.us-east-1.amazonaws.com/epm-lstr-acuity/postgres
    profiles: [main, initdb]
    restart: always
    ports:
      - "5432:5432"
    env_file: env-configs/postgres.env
    volumes:
      - type: volume
        source: pgdata
        target: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: 897021975362.dkr.ecr.us-east-1.amazonaws.com/epm-lstr-acuity/flyway
    profiles: [main, initdb]
    environment:
      # host must match the acuity-postgres service name below (app defaults in application.yml expect that hostname too)
      FLYWAY_URL: ${FLYWAY_URL:-jdbc:postgresql://acuity-postgres:5432/acuity_db}
      FLYWAY_USER: ${FLYWAY_USER:-dbadmin}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:-test}
      # must match POSTGRES_PASSWORD in the app env files - it's the password migrations assign the acuity role
      FLYWAY_ACUITY_PASSWORD: ${FLYWAY_ACUITY_PASSWORD:-test}
    depends_on:
      acuity-postgres:
        condition: service_healthy

  adminui:
    image: 897021975362.dkr.ecr.us-east-1.amazonaws.com/epm-lstr-acuity/admin
    profiles: [main]
    ports:
      - "9090:8000"
    env_file: env-configs/acuity-admin.env
    volumes:
      - ./local-file-storage:/usr/root/local-file-storage
    depends_on:
      flyway:
        condition: service_completed_successfully

  vahub:
    image: 897021975362.dkr.ecr.us-east-1.amazonaws.com/epm-lstr-acuity/va-hub
    profiles: [main]
    ports:
      - "8080:8000"
    env_file: env-configs/va-hub.env
    depends_on:
      flyway:
        condition: service_completed_successfully
volumes:
  pgdata:
