services:
  postgres:
    image: acuity-postgres
    restart: always
    ports:
      - "5432:5432"
    env_file: env-configs/postgres.env
    volumes:
      - type: volume
        source: pgdata
        target: /var/lib/postgresql/data/pgdata
      - type: bind
        source: ./images/postgres/data
        target: /usr/root/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  flyway:
    image: acuity-flyway
    env_file: env-configs/flyway.env
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
