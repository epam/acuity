name: docker build

on:
  pull_request:
    branches: [main]
    paths:
      - docker/**
      - clns-acuity-admin/**
      - clns-acuity-va-security/**
      - clns-acuity-vahub/**
      - clns-acuity-flyway/**
      - .dockerignore
      - .github/workflows/docker-build.yml

permissions:
  contents: read

# a new push to the PR makes the running builds stale
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [flyway, admin, va-hub, va-hub-ui]
    steps:
      - uses: actions/checkout@v7
        with:
          # the Dockerfiles COPY .git, keep the token out of the build context
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/images/${{ matrix.image }}.Dockerfile
          push: false
