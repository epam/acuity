name: terraform validate

on:
  pull_request:
    branches: [main]
    paths:
      - infrastructure/terraform/**
      - .github/workflows/terraform-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [acuity, bootstrap]
    defaults:
      run:
        working-directory: infrastructure/terraform/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4
      # No backend/credentials needed. -lockfile=readonly fails the PR if a lock file lacks the linux_amd64
      # hashes (regenerate with: terraform providers lock -platform=linux_amd64 -platform=darwin_arm64).
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
