name: Deploy Dev

# Run from a v* tag ("Use workflow from"); the tag is the image tag and the image_tag var.
# The role CI assumes comes from the repository variable AWS_ROLE_ARN (see infrastructure/terraform/acuity/README.md).
on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Dev Environment
        type: choice
        options: [dev-1]

permissions: {}

# one apply per workspace at a time; queue, never drop or cancel (a cancelled apply leaves a stale lock)
concurrency:
  group: deploy-${{ inputs.workspace }}
  cancel-in-progress: false
  queue: max

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: dev
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # origin/main is needed for the ancestry check
          fetch-depth: 0
          persist-credentials: false
      - env:
          WORKSPACE: ${{ inputs.workspace }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo "::error::repository variable AWS_ROLE_ARN is not set"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != tag || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::run from a vX.Y.Z release tag (ref=$GITHUB_REF_NAME, ref_type=$GITHUB_REF_TYPE)"
            exit 1
          fi
          if [[ ! "$WORKSPACE" =~ ^dev-[0-9]+$ ]]; then
            echo "::error::workspace must match ^dev-[0-9]+\$"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main's history"
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - run: aws sts get-caller-identity > /dev/null

  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: dev
      deployment: false
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        image: [flyway, admin, va-hub, va-hub-ui]
    steps:
      - uses: actions/checkout@v7
        with:
          # the Dockerfiles COPY .git, keep the token out of the build context
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/images/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/epm-lstr-acuity/${{ matrix.image }}:${{ github.ref_name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # stays inside the role's 1 h OIDC session
    timeout-minutes: 45
    environment: dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure/terraform/acuity
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - run: terraform init -input=false -lockfile=readonly
      # never -or-create: a workspace missing from state must fail the run
      - env:
          WORKSPACE: ${{ inputs.workspace }}
        run: terraform workspace select "$WORKSPACE"
      - env:
          TAG: ${{ github.ref_name }}
        run: terraform apply -auto-approve -input=false -lock-timeout=5m -var "image_tag=$TAG"
