# email settings
mail:
  send-debug-info-to: user@domain.com
  sender:
    # SMTP server url
    host: localhost
    # SMTP server port
    port: 25

# session cookie name used by SpringBoot (by default JSESSIONID;
# more info: https://stackoverflow.com/questions/25918556/spring-boot-configure-custom-jsessionid-for-embedded-server )
server:
  session:
    cookie:
      name: ADMINUISESSIONID

# Spring Batch-specific option: disables all jobs execution on app startup (more info: https://www.baeldung.com/spring-batch-testing-job)
spring:
  batch:
    # Flyway already creates BATCH_* tables (see clns-acuity-flyway migrations); without this,
    # Spring Boot's BatchAutoConfiguration tries to re-run spring-batch-core's own schema-postgresql.sql
    # using the "acuity" role, which only has USAGE (not CREATE) on schema "acuity" -> "permission
    # denied for schema acuity" on every app startup (harmless/swallowed, but spams the DB logs).
    initializer:
      enabled: false
    job:
      enabled: false