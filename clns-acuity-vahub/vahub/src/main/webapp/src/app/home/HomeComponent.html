<div class="home-container">
    <div class="container">
        <div class="about-container">
            <img src="/assets/images/acuity-logo.png" id="logo" class="app-logo" alt="logo"/>
            <div class="row getting-started-row">
                <div class="flex-container aligned">
                    <div class="flex-item">
                        <a class="thumbnail forced-height home-thumbnail" (click)="navigate('')"
                           data-toggle="tooltip" data-placement="bottom"
                           [title]="'Click here to select the study you want to analyse'">
                            <img src="/assets/images/analytics-services.png" id="analytics-services" alt=" "
                                 class="thumbnail-img"/>
                            <p>Analytics Services</p>
                        </a>
                    </div>
                    <div class="flex-item" [ngClass]="{'no-cursor': !serviceAt(0)?.url}" data-toggle="tooltip" data-placement="bottom"
                         title="{{getTooltipText(!!serviceAt(0)?.url)}}">
                        <a class="thumbnail forced-height home-thumbnail" [attr.href]="serviceAt(0)?.url || null"
                           data-toggle="tooltip" data-placement="bottom" [ngClass]="{'disabled': !serviceAt(0)?.url}">
                            <img src="/assets/images/omics.png" id="omics" alt=" " class="thumbnail-img"/>
                            <p>{{serviceAt(0)?.title}}</p>
                        </a>
                    </div>
                    <div class="flex-item" [ngClass]="{'no-cursor': !serviceAt(1)?.url}" data-toggle="tooltip" data-placement="bottom"
                         title="{{getTooltipText(!!serviceAt(1)?.url)}}">
                        <a class="thumbnail forced-height home-thumbnail" [attr.href]="serviceAt(1)?.url || null"
                           data-toggle="tooltip" data-placement="bottom" [ngClass]="{'disabled': !serviceAt(1)?.url}">
                            <img src="/assets/images/patient.png" id="patient" alt=" " class="thumbnail-img"/>
                            <p>{{serviceAt(1)?.title}}</p>
                        </a>
                    </div>
                    <div class="flex-item" [ngClass]="{'no-cursor': !serviceAt(2)?.url}" data-toggle="tooltip" data-placement="bottom"
                         title="{{getTooltipText(!!serviceAt(2)?.url)}}">
                        <a class="thumbnail forced-height home-thumbnail" [attr.href]="serviceAt(2)?.url || null"
                           data-toggle="tooltip" data-placement="bottom" [ngClass]="{'disabled': !serviceAt(2)?.url}">
                            <img src="/assets/images/machine_learning.png" id="machine-learning" alt=" "
                                 class="thumbnail-img"/>
                            <p>{{serviceAt(2)?.title}}</p>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="company-logo" *ngIf="hasCompanyLogo">
        <img src="/assets/{{pathToImages}}/company.png" id="company" class="company-image" alt=" "/>
    </div>
</div>
